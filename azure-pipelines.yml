trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: "Validate Python"
    jobs:
      - job: PythonSyntax
        displayName: "Check Python syntax"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
            displayName: "Use Python 3.12"

          - script: python -m compileall -q agents backend models orchestrator services ui
            displayName: "Compile Python files"

          - script: python -m unittest discover -s tests
            displayName: "Run backend API tests"

  - stage: BuildAndTest
    displayName: "Build Docker images and health check"
    dependsOn: Validate
    jobs:
      - job: DockerBuildAndHealthCheck
        displayName: "Build and test frontend and backend containers"
        steps:
          - checkout: self

          - script: |
              set -eu
              docker compose up --build --detach
              cleanup() {
                docker compose logs || true
                docker compose down --volumes
              }
              trap cleanup EXIT

              attempt=0
              until curl --fail --silent --output /dev/null http://127.0.0.1:8000/health \
                && curl --fail --silent --output /dev/null http://127.0.0.1:8501/_stcore/health; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 30 ]; then
                  echo "Frontend and backend did not become healthy in 60 seconds."
                  exit 1
                fi
                sleep 2
              done
              echo "Frontend and backend health checks passed."
            displayName: "Build containers and run health checks"
