trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: "Validate Python"
    jobs:
      - job: PythonSyntax
        displayName: "Check Python syntax"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
            displayName: "Use Python 3.12"

          - script: python -m compileall -q agents models orchestrator services ui
            displayName: "Compile Python files"

  - stage: BuildAndTest
    displayName: "Build Docker image and health check"
    dependsOn: Validate
    jobs:
      - job: DockerBuildAndHealthCheck
        displayName: "Build and test container"
        steps:
          - checkout: self

          - script: docker build --tag ai-devops-factory:$(Build.BuildId) .
            displayName: "Build Docker image"

          - script: |
              set -eu
              image="ai-devops-factory:$(Build.BuildId)"
              container_id="$(docker run --detach --publish 8501:8501 "$image")"
              cleanup() {
                docker logs "$container_id" || true
                docker stop "$container_id" >/dev/null 2>&1 || true
              }
              trap cleanup EXIT

              attempt=0
              until curl --fail --silent --output /dev/null http://127.0.0.1:8501/_stcore/health; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 30 ]; then
                  echo "Streamlit did not become healthy in 60 seconds."
                  exit 1
                fi
                sleep 2
              done
              echo "Streamlit health check passed."
            displayName: "Run container health check"
