services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ai-devops-factory-backend
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-lmstudio}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      PROJECTS_ROOT: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROJECTS_PATH:-.}:/workspace
      - generated_projects:/app/generated_projects
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ai-devops-factory-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ${PROJECTS_PATH:-.}:/workspace:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  generated_projects:
